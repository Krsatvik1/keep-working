name: Afoot
options:
  bundleIdPrefix: xyz.krsatvik
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: MQ663L65WN
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  Afoot:
    type: application
    platform: macOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Afoot
        CFBundleName: Afoot
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleIconFile: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: xyz.krsatvik.Afoot
            CFBundleURLSchemes: [afoot]
    entitlements:
      path: App/App.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.krsatvik.Afoot
        PRODUCT_NAME: Afoot
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      # The Claude logo comes from the installed Claude app at build time; it is never committed here.
      - name: Claude logo
        basedOnDependencyAnalysis: false
        script: |
          R=/Applications/Claude.app/Contents/Resources
          D="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$D"
          cp "$R/electron.icns" "$D/AppIcon.icns" || echo "warning: Claude.app icon not found"
          cp "$R"/TrayIconTemplate*.png "$D/" || echo "warning: Claude.app menu-bar icon not found"
    dependencies:
      - target: AfootWidget
  AfootWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Afoot
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /.claude/
          - /Library/Application Support/Claude/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.krsatvik.Afoot.Widget
        PRODUCT_NAME: AfootWidget
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
