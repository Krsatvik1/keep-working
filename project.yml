name: KeepWorking
options:
  bundleIdPrefix: xyz.krsatvik
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: MQ663L65WN
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  KeepWorking:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Resources/AppIcon-1024.png"]
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Keep Working
        CFBundleName: Keep Working
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleIconFile: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: xyz.krsatvik.KeepWorking
            CFBundleURLSchemes: [keepworking]
    entitlements:
      path: App/App.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.krsatvik.KeepWorking
        PRODUCT_NAME: Keep Working
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - target: KeepWorkingWidget
  KeepWorkingWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Keep Working
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /.claude/
          - /Library/Application Support/Claude/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.krsatvik.KeepWorking.Widget
        PRODUCT_NAME: KeepWorkingWidget
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
